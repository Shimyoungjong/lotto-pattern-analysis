name: 로또 데이터 주간 업데이트

on:
  schedule:
    # 매주 토요일 23:00 KST = 14:00 UTC
    - cron: '0 14 * * 6'
  workflow_dispatch:
    # 수동 실행 버튼 (GitHub Actions 탭에서 직접 실행 가능)

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # DB/분석 결과 커밋을 위한 쓰기 권한

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Python 패키지 설치
        run: pip install -r requirements.txt openpyxl xlrd playwright

      - name: Playwright Chromium 설치
        run: playwright install chromium --with-deps

      - name: 엑셀 다운로드 및 DB 업데이트
        run: python main.py --download

      - name: 통계 분석 및 시각화 실행
        run: python main.py --analyze

      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/lotto.db outputs/figures/
          # 변경사항이 없으면 커밋 스킵
          git diff --staged --quiet && echo "변경사항 없음, 스킵" || \
          git commit -m "chore: 로또 데이터 업데이트 $(date '+%Y-%m-%d')"
          git push
