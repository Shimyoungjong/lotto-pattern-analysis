name: 로또 데이터 주간 업데이트

on:
  schedule:
    # 매주 토요일 23:00 KST = 14:00 UTC
    - cron: '0 14 * * 6'
  workflow_dispatch:

jobs:
  update:
    # 로컬 PC 러너 사용 (한국 IP로 동행복권 접근)
    runs-on: self-hosted
    permissions:
      contents: write

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 패키지 설치
        run: python -m pip install -r requirements.txt openpyxl xlrd playwright

      - name: Playwright Chromium 설치
        run: python -m playwright install chromium

      - name: 엑셀 다운로드 및 DB 업데이트
        run: python main.py --download --headless

      - name: 통계 분석 및 시각화 실행
        run: python main.py --analyze

      - name: 변경사항 커밋 & 푸시
        shell: powershell
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/lotto.db outputs/figures/
          $changes = git diff --staged --name-only
          if ($changes) {
            $date = Get-Date -Format "yyyy-MM-dd"
            git commit -m "chore: 로또 데이터 업데이트 $date"
            git push
          } else {
            Write-Host "변경사항 없음, 스킵"
          }
