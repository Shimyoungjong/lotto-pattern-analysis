name: 로또 데이터 주간 업데이트

on:
  schedule:
    # 매주 토요일 23:00 KST = 14:00 UTC
    - cron: '0 14 * * 6'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 데이터 업데이트 (xlsx 초기 로드 + API 신규 회차)
        run: python main.py --download

      - name: 통계 분석 및 시각화
        run: python main.py --analyze

      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/lotto.db outputs/figures/
          git diff --staged --quiet || (git commit -m "chore: 로또 데이터 업데이트 $(date '+%Y-%m-%d')" && git push)
